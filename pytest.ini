# -*- coding: utf-8 -*-
# Pytest 全局配置

[pytest]
# 测试用例根目录
testpaths = testcases

# 输出更详细的 traceback
addopts =
    -v
    -s
    --tb=short
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
    -p no:cacheprovider
    # 稳定性治理：CI 外部站点网络抖动兜底（setup 失败也会重跑）
    --reruns 2
    --reruns-delay 3

# 自定义 markers
markers =
    login: 登录模块用例
    products: 商品主页模块用例
    product_detail: 商品详情模块用例
    cart: 购物车模块用例
    checkout: 结账流程模块用例
    special_users: 异常账户缺陷验证用例
    smoke: 冒烟用例
    flaky: 已知不稳定用例（配合 rerunfailures 重试）
