# =====================================================================
# SauceDemo 自动化测试 —— GitHub Actions CI/CD（Docker 版 · 优化版）
# 触发：push / PR → main、手动、定时（每天北京时间 06:00）
# 流程：环境指纹判定 →（仅在环境变化时）构建镜像 → 容器内跑测试
#       → 生成 Allure 报告 → 上传 artifact → 部署到 GitHub Pages
#
# 优化点：
#   1. 镜像 tag 改为基于「Dockerfile + requirements.txt」内容指纹，
#      而非 commit sha —— 业务代码变化不再触发镜像重建
#   2. 构建前先用 docker manifest inspect 检查目标 tag 是否已存在，
#      已存在则跳过 build-and-push 全部构建步骤
#   3. 效果：只改测试用例 / 页面代码时，CI 直接复用已有环境镜像，
#      省去镜像构建（约 3~5 分钟），仅保留 checkout + 测试 + 报告
#
# =====================================================================
name: "SauceDemo 自动化测试 (Docker)"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      browser:
        description: "浏览器 (chrome/firefox/edge)"
        required: false
        default: "chrome"
  schedule:
    - cron: "0 22 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  build-and-push:
    name: 🐳 构建并推送镜像（按需）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_with_tag: ${{ steps.decide.outputs.image_with_tag }}
      rebuilt: ${{ steps.decide.outputs.rebuilt }}

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # 关键步骤：计算环境指纹 + 检查镜像是否已存在
      # 指纹来源 = Dockerfile + requirements.txt 的 sha256
      # 这两个文件不变 → 指纹不变 → tag 不变 → 镜像已存在 → 跳过构建
      # ----------------------------------------------------------
      - name: 🔧 计算环境指纹 & 判断是否需要构建
        id: decide
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"
          # 基于 Dockerfile + requirements.txt 内容计算指纹
          ENV_HASH=$(cat Dockerfile requirements.txt | sha256sum | cut -c1-12)
          TAG="env-${ENV_HASH}"
          IMAGE_WITH_TAG="${IMAGE_NAME}:${TAG}"
          echo "image_with_tag=${IMAGE_WITH_TAG}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "env_hash=${ENV_HASH}" >> $GITHUB_OUTPUT
          echo "🔍 环境指纹: ${ENV_HASH}"
          echo "🔍 目标镜像: ${IMAGE_WITH_TAG}"
          # 登录 GHCR（manifest inspect 私有包需要认证）
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          # 检查镜像是否已存在
          if docker manifest inspect "${IMAGE_WITH_TAG}" >/dev/null 2>&1; then
            echo "✅ 镜像已存在于 GHCR，跳过构建"
            echo "rebuilt=false" >> $GITHUB_OUTPUT
          else
            echo "🔨 镜像不存在，将执行构建"
            echo "rebuilt=true" >> $GITHUB_OUTPUT
          fi

      - name: 🐳 设置 Docker Buildx
        if: steps.decide.outputs.rebuilt == 'true'
        uses: docker/setup-buildx-action@v4

      - name: 📤 登录 GitHub Container Registry
        if: steps.decide.outputs.rebuilt == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 构建并推送 Docker 镜像
        if: steps.decide.outputs.rebuilt == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.decide.outputs.image_with_tag }}
            ${{ steps.decide.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 构建摘要
        run: |
          if [ "${{ steps.decide.outputs.rebuilt }}" = "true" ]; then
            echo "🏗️ 本次执行了镜像构建（环境有变化）"
          else
            echo "♻️ 本次跳过镜像构建，复用已有环境镜像"
          fi
          echo "🏷️ 使用镜像: ${{ steps.decide.outputs.image_with_tag }}"

  test:
    name: 🧪 运行测试
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 30

    container:
      image: ${{ needs.build-and-push.outputs.image_with_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v6

      - name: 🧪 运行测试
        working-directory: ${{ github.workspace }}
        env:
          HEADLESS: "true"
          CONTAINER: "1"
          BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
          CI: "true"
          # pageLoadStrategy=eager 下 PAGE_LOAD_TIMEOUT 控制的是 DOMContentLoaded 超时
          # CI → saucedemo.com 网络延迟高，60s 安全余量避免极端慢请求导致 TimeoutException
          PAGE_LOAD_TIMEOUT: "60"
          # GitHub Actions runner 网络/资源较慢，元素级显式等待保持 30s
          EXPLICIT_WAIT: "30"
        run: |
          python -m pytest -v \
            --alluredir=reports/allure-results \
            --clean-alluredir

      # 生成 Allure 报告
      - name: 📊 生成 Allure HTML 报告
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          allure generate reports/allure-results -o reports/allure-report --clean

      # 从 gh-pages 分支拉取历史趋势数据
      - name: 📥 拉取 Allure 历史（趋势图）
        if: always()
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: 🔧 合并历史数据
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p reports/allure-results/history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/* reports/allure-results/history/ || true
            echo "✅ 历史数据已合并"
          fi

      # 重新生成带历史数据的报告
      - name: 📊 重新生成 Allure 报告（含历史）
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          allure generate reports/allure-results -o reports/allure-report --clean

      # 上传 Allure 报告
      - name: 📤 上传 Allure 报告 (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_number }}
          path: ${{ github.workspace }}/reports/allure-report
          retention-days: 90

      # 上传日志和截图
      - name: 📤 上传日志 / 截图 (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/logs
            ${{ github.workspace }}/screenshots
          retention-days: 30
          if-no-files-found: ignore

  deploy-pages:
    name: 🚀 部署 Allure 报告到 GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 下载 Allure 报告 artifact
        uses: actions/download-artifact@v8
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report

      - name: 🚀 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(allure): update report [${{ github.run_number }}]"

  notify:
    name: 📢 失败通知
    runs-on: ubuntu-latest
    needs: [test, deploy-pages]
    if: failure()
    steps:
      - name: 📢 发送失败通知
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ 未配置 WEBHOOK_URL，跳过通知"
            exit 0
          fi
          MSG="{\"msg_type\":\"text\",\"content\":{\"text\":\"🔴 SauceDemo 自动化测试失败！\\n仓库: ${{ github.repository }}\\n分支: ${{ github.ref_name }}\\n提交: ${{ github.event.head_commit.message || '手动触发' }}\\n链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}"
          curl -s -X POST -H "Content-Type: application/json" -d "$MSG" "$WEBHOOK_URL"
