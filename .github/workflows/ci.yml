# =====================================================================
# SauceDemo 自动化测试 —— GitHub Actions CI/CD（Docker 版）
# 触发：push / PR → main、手动、定时（每天北京时间 06:00）
# 流程：Checkout → 构建 Docker 镜像 → 在容器内跑测试
#       → 生成 Allure 报告 → 上传 artifact → 部署到 GitHub Pages
# 
# 与旧版对比优势：
#   1. 环境完全由 Dockerfile 定义，与本地开发 100% 一致
#   2. 无需在 CI 中重复安装 Chrome/JDK/Allure，镜像已内置
#   3. 构建速度更快（依赖层已缓存）
#   4. 镜像可推送到 GHCR，供后续部署使用
# =====================================================================
name: "SauceDemo 自动化测试 (Docker)"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      browser:
        description: "浏览器 (chrome/firefox/edge)"
        required: false
        default: "chrome"
  schedule:
    - cron: "0 22 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  build-and-push:
    name: 🐳 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.image }}  # 输出完整镜像名（不含 tag）
      image_with_tag: ${{ steps.meta.outputs.image_with_tag }}  # 输出完整镜像名（含 tag）
    
    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v6

      - name: 🔧 准备镜像名称
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image_with_tag=${IMAGE_NAME}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "✅ 镜像名称: ${IMAGE_NAME}:${{ github.sha }}"

      - name: 🐳 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📤 登录 GitHub Container Registry
        uses: docker/login-action@v4

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 构建并推送 Docker 镜像
        uses: docker/build-push-action@v7

        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image_with_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: 🧪 运行测试
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 30
    
    container:
      image: ${{ needs.build-and-push.outputs.image_with_tag }}  # 使用 outputs
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    
    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v6

      - name: 🧪 运行测试
        working-directory: ${{ github.workspace }}
        env:
          HEADLESS: "true"
          CONTAINER: "1"
          BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
          CI: "true"
        run: |
          python -m pytest -v \
            --alluredir=reports/allure-results \
            --clean-alluredir

      # 生成 Allure 报告
      - name: 📊 生成 Allure HTML 报告
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          allure generate reports/allure-results -o reports/allure-report --clean

      # 从 gh-pages 分支拉取历史趋势数据
      - name: 📥 拉取 Allure 历史（趋势图）
        if: always()
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: 🔧 合并历史数据
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p reports/allure-results/history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/* reports/allure-results/history/ || true
            echo "✅ 历史数据已合并"
          fi

      # 重新生成带历史数据的报告
      - name: 📊 重新生成 Allure 报告（含历史）
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          allure generate reports/allure-results -o reports/allure-report --clean

      # 上传 Allure 报告
      - name: 📤 上传 Allure 报告 (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_number }}
          path: ${{ github.workspace }}/reports/allure-report
          retention-days: 90

      # 上传日志和截图
      - name: 📤 上传日志 / 截图 (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/logs
            ${{ github.workspace }}/screenshots
          retention-days: 30
          if-no-files-found: ignore

  deploy-pages:
    name: 🚀 部署 Allure 报告到 GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 下载 Allure 报告 artifact
        uses: actions/download-artifact@v8
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report

      - name: 🚀 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(allure): update report [${{ github.run_number }}]"

  notify:
    name: 📢 失败通知
    runs-on: ubuntu-latest
    needs: [test, deploy-pages]
    if: failure()
    steps:
      - name: 📢 发送失败通知
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ 未配置 WEBHOOK_URL，跳过通知"
            exit 0
          fi
          MSG="{\"msg_type\":\"text\",\"content\":{\"text\":\"🔴 SauceDemo 自动化测试失败！\\n仓库: ${{ github.repository }}\\n分支: ${{ github.ref_name }}\\n提交: ${{ github.event.head_commit.message || '手动触发' }}\\n链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}"
          curl -s -X POST -H "Content-Type: application/json" -d "$MSG" "$WEBHOOK_URL"
